[tools]
erlang = "29.1.2"
rebar = "3.28.0"
"github:WhatsApp/erlang-language-platform" = { version = "2026-10-14", matching = "otp-29.1.tar.gz" }

[env]
# Keep ELP paired with its bundled Eqwalizer instead of an unrelated local build.
ELP_EQWALIZER_PATH = false

[tasks.compile]
run = "rebar3 compile"

[tasks.clean]
run = "rebar3 clean"

[tasks.format]
run = "rebar3 fmt"

[tasks.format-check]
run = "rebar3 fmt --check"

[tasks.test]
run = "rebar3 as test do eunit"

[tasks.dialyzer]
run = "rebar3 dialyzer"

# Resolve the pinned ELP even when a local build precedes it on PATH.
[tasks.eq]
run = "mise exec -- elp eqwalize"

[tasks.eq-all]
run = "mise exec -- elp eqwalize-all"

[tasks.docs]
run = "rebar3 ex_doc"

[tasks.cover]
run = """
rebar3 as test do eunit --cover
rebar3 as test do cover --verbose
open ./_build/test/cover/index.html
"""

[tasks.check]
run = """
set -e
rebar3 compile
rebar3 fmt --check
rebar3 as test do eunit
rebar3 dialyzer
mise exec -- elp eqwalize-all
"""

[tasks.erl]
run = "rebar3 shell"

[tasks.refresh-testdata]
description = "Refresh compliance fixtures from personnummer/meta"
run = """
for f in list.json interim.json structured.json; do
    curl -sf "https://raw.githubusercontent.com/personnummer/meta/master/testdata/$f" \\
        -o "test/testdata/$f"
done
"""

[tasks.publish]
description = "Publish to Hex and tag the release"
run = """
set -e
git diff --quiet || { echo "Working tree dirty — commit or stash first."; exit 1; }
git diff --cached --quiet || { echo "Staged changes uncommitted."; exit 1; }
VERSION=$(awk -F'"' '/vsn,/ {print $2}' src/personnummer_erl.app.src)
[ -n "$VERSION" ] || { echo "Could not read vsn from src/personnummer_erl.app.src"; exit 1; }
echo "Publishing personnummer_erl $VERSION..."
rebar3 hex publish
git tag "v$VERSION"
git push origin "v$VERSION"
echo "Released v$VERSION"
"""
