name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REBAR3_VERSION: "3.27.3"
  ELP_VERSION: "2026-10-14"

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "27"
            elp_otp: "27.3"
          - otp: "28"
            elp_otp: "28.5"
          - otp: "29"
            elp_otp: "29.1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Cache _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build
          key: ${{ runner.os }}-otp${{ matrix.otp }}-build-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-build-

      - name: Cache dialyzer PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rebar3
          key: ${{ runner.os }}-otp${{ matrix.otp }}-plt-${{ hashFiles('rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-plt-

      - name: Compile
        run: rebar3 compile

      - name: Format check
        run: rebar3 fmt --check

      - name: EUnit
        run: rebar3 as test 'do' eunit --cover

      - name: Coverage
        run: rebar3 as test 'do' cover --verbose

      - name: Dialyzer
        run: rebar3 dialyzer

      - name: Install elp
        run: |
          curl -fsSL -o /tmp/elp.tar.gz \
            "https://github.com/WhatsApp/erlang-language-platform/releases/download/${ELP_VERSION}/elp-linux-x86_64-unknown-linux-gnu-otp-${{ matrix.elp_otp }}.tar.gz"
          tar xzf /tmp/elp.tar.gz -C /usr/local/bin
          elp version

      - name: Eqwalizer
        run: elp eqwalize-all
